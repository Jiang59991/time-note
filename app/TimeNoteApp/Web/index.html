    /* Calendar week: seven equal days, time runs downwards. */

  <main class="desktop">
    <section class="sheet" id="sheet" data-view="day" aria-label="时间便签">
      <header><div class="tools"><button type="button" id="tools-toggle" aria-label="设置与备份" aria-expanded="false" aria-controls="tools-menu">⚙</button><div id="tools-menu" class="tools-menu" hidden><button type="button" data-utility="settings">窗口设置</button><button type="button" id="manage-categories">标签管理</button><button type="button" data-utility="notifications">允许番茄到时通知</button><button type="button" data-utility="export:json">导出完整备份</button><button type="button" data-utility="export:csv">导出 CSV</button><button type="button" data-utility="export:markdown">导出 Markdown</button><button type="button" data-utility="import">导入备份…</button><button type="button" data-utility="load">重新读取数据</button></div></div>
        <div class="date-line"><button type="button" class="date-nav" id="prev-date" aria-label="前一天或前一周">‹</button><span id="date-label"></span><button type="button" class="date-nav next" id="next-date" aria-label="后一天或后一周">›</button></div>
        <nav class="tabs" aria-label="时间便签视图" role="tablist"><button type="button" role="tab" id="tab-day" aria-controls="view-day" data-view="day" aria-selected="true">日览</button><button type="button" role="tab" id="tab-week" aria-controls="view-week" data-view="week" aria-selected="false">周览</button><button type="button" role="tab" id="tab-record" aria-controls="view-record" data-view="record" aria-selected="false">记录</button></nav>
      </header>
      <button type="button" class="activity-line" id="activity-line" aria-label="查看进行中的任务"><span><i class="status-dot"></i><span id="activity-count">正在读取…</span></span><span class="mono now" id="clock-label"></span></button>
      <section id="view-day" role="tabpanel" aria-labelledby="tab-day"><div id="day-axis" class="axis"></div><div id="day-track"></div><section class="todo-section" aria-label="当天待办"><h2>To-do</h2><div id="todo-list"></div><form id="todo-form"><input id="todo-input" aria-label="新增当天待办" placeholder="留一件想做的事…" maxlength="120" autocomplete="off"><button type="submit" aria-label="添加待办">＋</button></form></section></section>
      <section id="view-week" role="tabpanel" aria-labelledby="tab-week" hidden><div class="week-calendar"><div class="week-hours" id="week-axis" aria-label="0 到 24 点"></div><div id="week-days" class="week-days"></div></div><div id="category-summary" class="category-summary" aria-label="本周分类时长"></div></section>
      <section id="view-record" role="tabpanel" aria-labelledby="tab-record" hidden>
        <div class="mode-tabs" role="group" aria-label="记录方式"><button type="button" data-entry-mode="timer" aria-pressed="true">现在开始</button><button type="button" data-entry-mode="manual" aria-pressed="false">补记一段</button></div>
        <form id="entry-form" novalidate>
          <label class="field"><span class="field-label">做什么</span><input id="new-title" class="title-input" placeholder="例如：阅读论文" maxlength="120" autocomplete="off"></label>
          <div class="field"><label class="field-label" for="new-category">分类<button type="button" id="new-manage-categories" class="category-reset">管理标签</button><span id="new-category-status" class="category-status">自动识别</span><button type="button" class="category-reset" id="new-category-reset" hidden>恢复自动</button></label><select id="new-category"></select></div>
          <div id="timer-fields" class="form-row timer-options"><label class="field"><span class="field-label">计时方式</span><select id="new-timer-mode"><option value="countup">普通计时 · 自己结束</option><option value="pomodoro">番茄钟 · 到时结束</option></select></label><label class="field" id="minutes-field" hidden><span class="field-label">分钟</span><input id="new-minutes" type="number" min="1" max="240" value="25" inputmode="numeric"></label></div>
          <div id="manual-fields" hidden>
            <button type="button" class="date-toggle" id="new-date-toggle" aria-expanded="false" aria-controls="new-date-fields"><span id="new-date-summary">今天</span> · 更改日期</button>
            <div class="form-row date-fields" id="new-date-fields" hidden><label class="field"><span class="field-label">开始日期</span><input id="new-start-date" type="date"></label><label class="field"><span class="field-label">结束日期</span><input id="new-end-date" type="date"></label></div>
            <div class="form-row"><label class="field"><span class="field-label">开始时间</span><input id="new-start" type="text" class="clock-input" inputmode="numeric" placeholder="00:00" autocomplete="off" pattern="[0-9]{2}:[0-9]{2}" aria-label="补记开始时间"></label><label class="field"><span class="field-label">结束时间</span><input id="new-end" type="text" class="clock-input" inputmode="numeric" placeholder="00:00" autocomplete="off" pattern="[0-9]{2}:[0-9]{2}" aria-label="补记结束时间"></label></div>
            <label class="next-day"><input type="checkbox" id="new-next-day">结束于次日</label>
          </div>
          <div id="entry-error" class="form-error" role="alert"></div>
          <div class="form-actions"><span class="hint" id="entry-hint">已有事项会继续计时。<br>每一项都有自己的结束按钮。</span><button class="primary" id="entry-submit" type="submit">开始计时</button></div>
        </form>
        <section class="ongoing" aria-label="进行中的任务"><h2 class="ongoing-heading"><span id="running-heading">进行中</span><span>分别结束 · 互不影响</span></h2><div id="running-list"></div></section>
        <div id="pomo-notice" class="notice" hidden></div>
      </section>
      <div id="connection-error" class="form-error" role="alert" hidden></div><div id="status" class="status" role="status" aria-live="polite"></div>
    </section>
  </main>
  <div id="time-peek" class="time-peek" role="tooltip" hidden></div>
  <dialog id="overlap-picker" aria-labelledby="overlap-title"><div class="editor-head"><h2 id="overlap-title">同时进行</h2><button type="button" class="close" id="overlap-close" aria-label="关闭重叠事项列表">×</button></div><p class="editor-state">选择要查看或修改的事项</p><div id="overlap-items"></div></dialog>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form" novalidate>
      <div class="editor-head"><div><h2 id="editor-title">修改记录</h2><div class="id" id="edit-id"></div></div><button type="button" class="close" id="editor-close" aria-label="关闭编辑窗口">×</button></div>
      <p class="editor-state" id="editor-state"></p><div id="edit-conflict" class="form-error" hidden></div><button type="button" id="edit-reload" hidden>放弃草稿并重新读取</button>
      <label class="field"><span class="field-label">事项名称</span><input id="edit-title" maxlength="120" autocomplete="off"></label>
      <div class="field"><label class="field-label" for="edit-category">分类<button type="button" id="edit-manage-categories" class="category-reset">管理标签</button><span id="edit-category-status" class="category-status"></span><button type="button" id="edit-category-reset" class="category-reset">恢复自动</button></label><select id="edit-category"></select></div>
      <button type="button" class="date-toggle" id="edit-date-toggle" aria-expanded="false" aria-controls="edit-date-fields"><span id="edit-date-summary"></span> · 更改日期</button>
      <div class="form-row date-fields" id="edit-date-fields" hidden><label class="field"><span class="field-label">开始日期</span><input id="edit-start-date" type="date"></label><label class="field"><span class="field-label">结束日期</span><input id="edit-end-date" type="date"></label></div>
      <div class="form-row"><label class="field"><span class="field-label">开始时间</span><input id="edit-start" type="text" class="clock-input" inputmode="numeric" placeholder="00:00" autocomplete="off" pattern="[0-9]{2}:[0-9]{2}" required></label><label class="field"><span class="field-label" id="edit-end-label">结束时间</span><input id="edit-end" type="text" class="clock-input" inputmode="numeric" placeholder="00:00" autocomplete="off" pattern="[0-9]{2}:[0-9]{2}"></label></div>
      <label class="next-day"><input type="checkbox" id="edit-next-day">结束于次日</label>
      <label class="field" id="edit-pomo-field" hidden><span class="field-label">本轮番茄长度（分钟）</span><input id="edit-minutes" type="number" min="1" max="240" inputmode="numeric"></label>
      <p id="edit-help" class="editor-warning"></p><div id="edit-overlap" class="overlap-note" hidden></div><div id="edit-error" class="form-error" role="alert"></div>
      <div class="editor-actions"><button type="button" id="edit-delete" class="delete-record">删除记录</button><button type="button" id="edit-cancel">取消</button><button type="button" id="edit-stop" hidden>结束此任务</button><button type="submit" class="primary" id="edit-save">保存修改</button></div>
    </form>
  </dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title" style="font-size:17px;font-weight:400;margin:0">请确认</h2><p id="confirm-message"></p><div class="confirm-actions"><button type="button" id="confirm-cancel">取消</button><button type="button" id="confirm-ok" class="primary">确认</button></div></dialog>
  <dialog id="category-manager" aria-labelledby="category-heading">
    <div class="editor-head"><h2 id="category-heading">标签管理</h2><button type="button" class="close" id="category-close" aria-label="关闭标签管理">×</button></div>
    <p class="category-help">新增标签或修改颜色。删除标签后，相关记录归到“其他”，不会删除记录。</p>
    <div id="category-list"></div>
    <form id="category-form" novalidate>
      <label class="field"><span class="field-label">标签名称</span><input id="category-name" maxlength="20" autocomplete="off" placeholder="例如：生活、学习"></label>
      <div class="field-label" id="category-color-label">选择颜色</div><div id="category-palette" role="radiogroup" aria-labelledby="category-color-label"></div>
      <div id="category-error" class="form-error" role="alert"></div>
      <div class="editor-actions"><button type="button" id="category-reset" hidden>取消修改</button><button type="submit" class="primary" id="category-save">新增标签</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
